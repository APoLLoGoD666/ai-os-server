<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APEX — UX-18 MOBILE / RESPONSIVE</title>
<style>
/* ── UX-05 DESIGN TOKENS ─────────────────────────────────────────────────── */
:root{
  --bg:#0a0a0f;--surface:#111118;--surface-raised:#1a1a24;
  --border:#2a2a3a;--border-subtle:#1e1e2a;
  --tp:#e8e8f0;--ts:#9898b0;--tm:#5a5a70;
  --accent:#6b6bff;--accent-dim:#3d3d8a;
  --success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;
  --font:system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif;
  --mono:'SF Mono','Consolas','Courier New',monospace;
  --display:Georgia,'Palatino Linotype',serif;
  --r4:4px;--r8:8px;--r12:12px;--r16:16px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;
  --touch:44px;
  --header-h:48px;--bnav-h:56px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{height:100%;background:#1c1c28;color:var(--tp);font-family:var(--font);font-size:13px;line-height:1.5;overflow:hidden}

/* ── VIEWPORT SIMULATOR (prototype control bar) ──────────────────────────── */
#simBar{background:#080810;border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;z-index:1000;position:relative}
.sim-label{font-size:9px;color:var(--tm);letter-spacing:0.12em;text-transform:uppercase;margin-right:2px}
.sim-btn{padding:4px 12px;border-radius:var(--r4);border:1px solid var(--border);background:transparent;color:var(--tm);cursor:pointer;font-size:10px;font-family:var(--font);transition:all 0.15s;min-height:32px;letter-spacing:0.04em}
.sim-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sim-btn:hover:not(.active){color:var(--ts)}
.sim-info{font-size:10px;color:var(--tm);margin-left:auto}
.sim-sc{display:flex;align-items:center;gap:6px;margin-left:12px}
#scenarioSelect{background:var(--surface);border:1px solid var(--border);color:var(--ts);border-radius:var(--r4);padding:3px 8px;font-size:10px;font-family:var(--font);cursor:pointer;max-width:200px}

/* ── WRAPPER ─────────────────────────────────────────────────────────────── */
#outerWrap{flex:1;display:flex;justify-content:center;align-items:stretch;overflow:hidden;background:#1c1c28}
#app{display:flex;flex-direction:column;background:var(--bg);width:100%;height:100%;position:relative;overflow:hidden;transition:max-width 0.3s,box-shadow 0.3s}
.vp-mobile #app{max-width:390px;box-shadow:0 0 40px rgba(0,0,0,0.8)}
.vp-tablet #app{max-width:834px;box-shadow:0 0 40px rgba(0,0,0,0.6)}
.vp-desktop #app{max-width:1440px}

/* ── HEADER ──────────────────────────────────────────────────────────────── */
#header{display:flex;align-items:center;justify-content:space-between;padding:0 var(--s4);height:var(--header-h);border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);padding-top:var(--safe-top)}
.h-left{display:flex;align-items:center;gap:var(--s3)}
.menu-btn{width:var(--touch);height:var(--touch);display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--ts);cursor:pointer;border-radius:var(--r8);font-size:20px;flex-shrink:0}
.h-title{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:0.06em}
.h-right{display:flex;align-items:center;gap:var(--s2)}
.icon-btn{width:var(--touch);height:var(--touch);display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--ts);cursor:pointer;border-radius:var(--r8);font-size:18px;position:relative}
.notif-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.conn-sm{width:7px;height:7px;border-radius:50%;background:var(--success);flex-shrink:0}
.conn-sm.warn{background:var(--warning)}.conn-sm.err{background:var(--danger)}.conn-sm.pulse{animation:cpulse 1s infinite}
@keyframes cpulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── BODY ────────────────────────────────────────────────────────────────── */
#body{display:flex;flex:1;overflow:hidden;position:relative}

/* ── SIDE NAV / DRAWER ───────────────────────────────────────────────────── */
#sideNav{position:absolute;left:0;top:0;bottom:0;width:280px;background:var(--surface);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform 0.25s ease;z-index:100;display:flex;flex-direction:column;overflow-y:auto}
#sideNav.open{transform:translateX(0)}
#navOverlay{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 0.25s;z-index:99}
#navOverlay.on{opacity:0.5;pointer-events:auto}
.nav-sec{font-size:9px;font-weight:600;letter-spacing:0.14em;color:var(--tm);padding:12px 16px 4px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--ts);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;min-height:var(--touch);border-left:2px solid transparent;font-family:var(--font);font-size:13px;transition:background 0.1s}
.nav-item:hover{background:var(--surface-raised);color:var(--tp)}
.nav-item.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--tp)}
.nav-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.nav-sep{height:1px;background:var(--border-subtle);margin:6px 0}

/* Tablet+: persistent side nav */
.vp-tablet #sideNav,.vp-desktop #sideNav{position:relative;transform:none!important;flex-shrink:0}
.vp-tablet #navOverlay,.vp-desktop #navOverlay{display:none!important}
.vp-tablet .menu-btn,.vp-desktop .menu-btn{display:none}
.vp-tablet #body,.vp-desktop #body{flex-direction:row}
.vp-desktop #sideNav{width:260px}

/* ── MAIN AREA ───────────────────────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#connBanner{display:none;padding:8px var(--s4);font-size:11px;flex-shrink:0;align-items:center;justify-content:space-between;gap:8px}
#connBanner.degraded{display:flex;background:#2a1a0a;border-bottom:1px solid #f59e0b55;color:var(--warning)}
#connBanner.disconnected{display:flex;background:#2a0a0a;border-bottom:1px solid #ef444455;color:var(--danger)}
#connBanner.reconnecting{display:flex;background:#2a1a0a;border-bottom:1px solid #f59e0b55;color:var(--warning)}
.cb-btn{font-size:10px;padding:4px 10px;border-radius:var(--r4);border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;font-family:var(--font);min-height:var(--touch);flex-shrink:0}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--s4)}

/* ── BOTTOM NAV ──────────────────────────────────────────────────────────── */
#bnav{display:flex;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:var(--safe-bottom)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--tm);min-height:var(--touch);padding:6px 2px;border:none;background:transparent;font-family:var(--font);transition:color 0.15s;position:relative}
.bn-item.active{color:var(--accent)}
.bn-icon{font-size:22px;line-height:1}
.bn-label{font-size:8px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase}
.bn-badge{position:absolute;top:5px;right:calc(50% - 16px);background:var(--danger);color:#fff;font-size:8px;font-weight:700;border-radius:10px;padding:1px 4px;border:2px solid var(--surface)}
.vp-tablet #bnav,.vp-desktop #bnav{display:none}

/* ── RIGHT PANEL (tablet+) ───────────────────────────────────────────────── */
#rightPanel{display:none;flex-direction:column;border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;flex-shrink:0;width:280px}
.vp-tablet #rightPanel,.vp-desktop #rightPanel{display:flex}
.vp-desktop #rightPanel{width:320px}
.rp-label{font-size:10px;font-weight:600;letter-spacing:0.12em;color:var(--tm);padding:var(--s3) var(--s4);border-bottom:1px solid var(--border-subtle);text-transform:uppercase;flex-shrink:0}
#rightContent{padding:var(--s3);overflow-y:auto;flex:1}

/* ── VOICE FAB ───────────────────────────────────────────────────────────── */
#voiceFab{position:absolute;bottom:calc(var(--bnav-h) + var(--safe-bottom) + 14px);right:16px;width:56px;height:56px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(107,107,255,0.45);z-index:50;transition:background 0.2s,transform 0.15s}
#voiceFab:active{transform:scale(0.93)}
#voiceFab.listening{background:#dc2626;animation:fabp 1.2s ease-in-out infinite}
#voiceFab.speaking{background:var(--success)}
#voiceFab.thinking{background:#7c3aed}
@keyframes fabp{0%,100%{transform:scale(1);box-shadow:0 4px 20px rgba(220,38,38,0.5)}50%{transform:scale(1.1);box-shadow:0 6px 30px rgba(220,38,38,0.8)}}
.vp-tablet #voiceFab,.vp-desktop #voiceFab{bottom:20px}

/* ── VOICE OVERLAY ───────────────────────────────────────────────────────── */
#voiceOverlay{position:absolute;inset:0;background:rgba(10,10,15,0.97);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:0;pointer-events:none;transition:opacity 0.2s}
#voiceOverlay.on{opacity:1;pointer-events:auto}
.orb{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#9898ff,var(--accent));box-shadow:0 0 40px rgba(107,107,255,0.6);display:flex;align-items:center;justify-content:center;font-size:28px}
.orb.listening{animation:orbp 1.5s ease-in-out infinite;box-shadow:0 0 60px rgba(107,107,255,0.9)}
.orb.speaking{background:radial-gradient(circle at 35% 35%,#86efac,var(--success));box-shadow:0 0 40px rgba(34,197,94,0.6)}
.orb.thinking{background:radial-gradient(circle at 35% 35%,#c084fc,#7c3aed);animation:orbspin 2s linear infinite}
.orb.failed{background:radial-gradient(circle at 35% 35%,#fca5a5,var(--danger))}
@keyframes orbp{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes orbspin{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
.vstate{font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--tp)}
.vtranscript{font-size:13px;color:var(--ts);text-align:center;max-width:280px;min-height:18px}
.vprivacy{font-size:11px;color:var(--tm);text-align:center;max-width:260px;padding:8px 12px;background:var(--surface-raised);border-radius:var(--r12);border:1px solid var(--border)}
.vwave{display:flex;align-items:flex-end;gap:3px;height:28px}
.vw{width:4px;border-radius:3px 3px 0 0;background:var(--accent);animation:vwv 0.5s ease-in-out infinite alternate}
.vw:nth-child(2){animation-delay:0.07s}.vw:nth-child(3){animation-delay:0.14s}.vw:nth-child(4){animation-delay:0.21s}.vw:nth-child(5){animation-delay:0.28s}.vw:nth-child(6){animation-delay:0.35s}
@keyframes vwv{from{transform:scaleY(0.15)}to{transform:scaleY(1)}}
.v-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.v-btn{padding:10px 20px;border-radius:var(--r12);border:1px solid var(--border);background:var(--surface-raised);color:var(--ts);cursor:pointer;font-size:13px;min-height:var(--touch);font-family:var(--font)}
.v-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.v-btn.cancel{background:#2a0a0a;border-color:#ef444455;color:var(--danger)}
.vo-state-dot{width:8px;height:8px;border-radius:50%}

/* ── BOTTOM SHEET ────────────────────────────────────────────────────────── */
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);z-index:150;max-height:82vh;display:flex;flex-direction:column}
#sheet.open{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--border);margin:12px auto 8px;flex-shrink:0}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 12px;flex-shrink:0;border-bottom:1px solid var(--border)}
.sheet-title{font-size:13px;font-weight:600;color:var(--tp)}
.sheet-close{width:var(--touch);height:32px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--tm);cursor:pointer;font-size:20px;border-radius:var(--r8);margin-right:-8px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding:var(--s4)}
.vp-tablet #sheet,.vp-desktop #sheet{display:none}

/* ── CARDS & COMPONENTS ──────────────────────────────────────────────────── */
.card{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--r12);padding:var(--s3);margin-bottom:var(--s2)}
.card.tap{cursor:pointer;transition:border-color 0.15s}
.card.tap:active{background:#1e1e2a}
.card-title{font-size:12px;font-weight:600;color:var(--tp);margin-bottom:5px}
.card-body{font-size:12px;color:var(--ts);line-height:1.5}
.card-badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.card-meta{font-size:10px;color:var(--tm);margin-top:5px}

/* BADGES */
.b{display:inline-flex;align-items:center;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;letter-spacing:0.06em;text-transform:uppercase}
.b-agent{background:#1a1a0a;color:#facc15;border:1px solid #ca8a0433}
.b-voice{background:#1a1a2a;color:var(--accent);border:1px solid var(--accent-dim)}
.b-approval{background:#2a1a0a;color:var(--warning);border:1px solid #f59e0b33}
.b-action{background:#0a2a1a;color:var(--success);border:1px solid #22c55e33}
.b-memory{background:#0a1a2a;color:#67e8f9;border:1px solid #06b6d433}
.b-knowledge{background:#0a2a1a;color:#4ade80;border:1px solid #16a34a33}
.b-const{background:#1a0a2a;color:#a78bfa;border:1px solid #7c3aed33}
.b-error{background:#2a0a0a;color:var(--danger);border:1px solid #ef444433}
.b-system{background:#1a1a2a;color:var(--ts);border:1px solid var(--border)}
.b-activity{background:#0a1a2a;color:#60a5fa;border:1px solid #3b82f633}
.b-domain{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-dim)}
/* LIFECYCLE */
.ls{display:inline-flex;align-items:center;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:0.06em;text-transform:uppercase}
.ls-await{background:#2a1a0a;color:var(--warning);border:1px solid #f59e0b55;animation:apls 2s infinite}
.ls-blocked{background:#2a0a0a;color:var(--danger);border:1px solid #ef444455}
.ls-done{background:#0a2a1a;color:var(--success);border:1px solid #22c55e55}
.ls-exec{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent)}
.ls-failed{background:#2a0a0a;color:var(--danger);border:1px solid #ef444455}
.ls-proposed{background:#1a1a2a;color:var(--ts);border:1px solid var(--border)}
.ls-approved{background:#0a2a1a;color:var(--success);border:1px solid #22c55e44}
@keyframes apls{0%,100%{opacity:1}50%{opacity:0.6}}

/* DOMAIN PILLS */
.dom-row{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;margin-bottom:var(--s3);scrollbar-width:none}
.dom-row::-webkit-scrollbar{display:none}
.dom-pill{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface-raised);color:var(--tm);cursor:pointer;font-size:11px;font-weight:600;min-height:var(--touch);white-space:nowrap;display:flex;align-items:center;transition:all 0.15s}
.dom-pill.active{background:var(--accent-dim);border-color:var(--accent);color:var(--tp)}
.dom-pill:active{opacity:0.75}

/* DISCLOSURE */
.dl-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:var(--s3)}
.dl-btn{padding:6px 12px;border-radius:var(--r4);border:1px solid var(--border);background:transparent;color:var(--tm);cursor:pointer;font-size:11px;font-family:var(--font);min-height:var(--touch);min-width:42px}
.dl-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* EVIDENCE / PROVENANCE */
.ev-block{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--r8);padding:var(--s3);font-family:var(--mono);font-size:10px;margin-bottom:var(--s2);overflow-x:auto}
.ev-row{display:flex;gap:8px;padding:2px 0;color:var(--ts)}
.ek{color:var(--tm);width:100px;flex-shrink:0}
.pvbox{background:#16001a;border:1px solid #9333ea55;border-radius:var(--r8);padding:var(--s3);margin-bottom:var(--s2);text-align:center}
.pvbox .pvi{font-size:22px;color:#a855f7;margin-bottom:4px}
.pvbox .pvt{font-size:10px;font-weight:700;color:#a855f7;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px}
.pvbox p{font-size:11px;color:#c084fc;line-height:1.5}
.info-box{background:#0a1a2a;border:1px solid #3b82f655;border-radius:var(--r8);padding:var(--s3);margin-bottom:var(--s2)}
.info-box p{font-size:11px;color:#93c5fd;line-height:1.5}
.warn-box{background:#2a1a0a;border:1px solid #f59e0b55;border-radius:var(--r8);padding:var(--s3);margin-bottom:var(--s2)}
.warn-box p{font-size:11px;color:#fcd34d;line-height:1.5}
.danger-box{background:#2a0a0a;border:1px solid #ef444455;border-radius:var(--r8);padding:var(--s3);margin-bottom:var(--s2)}
.danger-box p{font-size:11px;color:#fca5a5;line-height:1.5}
.success-box{background:#0a2a1a;border:1px solid #22c55e55;border-radius:var(--r8);padding:var(--s3);margin-bottom:var(--s2)}
.success-box p{font-size:11px;color:#86efac;line-height:1.5}

/* APPROVAL */
.appr-area{background:var(--surface-raised);border:1px solid #f59e0b55;border-radius:var(--r12);padding:var(--s4);margin-bottom:var(--s3)}
.appr-label{font-size:10px;color:var(--warning);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.08em}
.appr-action{font-size:13px;color:var(--tp);margin-bottom:var(--s3);line-height:1.4}
.appr-safety{font-size:10px;color:var(--tm);margin-bottom:var(--s3)}
.appr-btns{display:flex;gap:var(--s2)}
.appr-btn{flex:1;padding:12px;border-radius:var(--r8);border:1px solid;cursor:pointer;font-size:13px;font-weight:600;min-height:var(--touch);font-family:var(--font)}
.appr-btn.approve{background:#0a2a1a;border-color:#22c55e55;color:var(--success)}
.appr-btn.decline{background:#2a0a0a;border-color:#ef444455;color:var(--danger)}
#apprConfirm{display:none;margin-top:var(--s2)}
#apprConfirm .warn-box{cursor:pointer}
#apprConfirm .warn-box:active{opacity:0.8}

/* DETAIL ROWS */
.dr{display:flex;justify-content:space-between;align-items:flex-start;padding:4px 0;border-bottom:1px solid var(--border-subtle);font-size:11px}
.dr:last-child{border-bottom:none}
.dk{color:var(--tm);flex-shrink:0;width:90px}
.dv{color:var(--ts);text-align:right;word-break:break-all;font-size:11px}

/* GATE CHAIN (vertical for mobile) */
.gate-chain{display:flex;flex-direction:column;gap:4px;margin-bottom:var(--s3)}
.gate-step{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r4);border:1px solid var(--border-subtle);font-size:11px;color:var(--ts)}
.gate-step.pass{background:#0a2a1a;border-color:#22c55e33;color:var(--success)}
.gate-step.fail{background:#2a0a0a;border-color:#ef444433;color:var(--danger)}
.gate-icon{font-size:14px;flex-shrink:0}

/* ACTIVITY EVENTS */
.ev-card{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--r12);padding:var(--s3);margin-bottom:var(--s2);cursor:pointer;transition:border-color 0.15s}
.ev-card.active{border-color:var(--accent)}
.ev-card:active{background:#1e1e2a}
.ev-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:5px}
.ev-time{font-size:10px;color:var(--tm);font-family:var(--mono);flex-shrink:0}
.ev-desc{font-size:12px;color:var(--tp);line-height:1.4;margin-bottom:4px}
.ev-meta{font-size:10px;color:var(--tm)}
.stale-tag{font-size:9px;font-weight:700;color:var(--warning);border:1px solid #f59e0b55;border-radius:3px;padding:1px 5px;margin-left:4px}

/* SC NOTE */
.sc-note{background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--r4);padding:6px var(--s3);font-size:10px;color:var(--tm);margin-bottom:var(--s3);line-height:1.5}

/* SCROLLBARS */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* FOCUS */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* LANDSCAPE */
@media(max-height:500px) and (max-width:1024px){
  :root{--header-h:40px;--bnav-h:48px}
  .orb{width:64px;height:64px}
  #voiceOverlay{flex-direction:row;gap:16px;flex-wrap:wrap}
}

/* REDUCED MOTION */
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:0.01ms!important}
}

<body style="display:flex;flex-direction:column;height:100vh">

<!-- VIEWPORT SIMULATOR -->

    </div>

    <!-- RIGHT PANEL (tablet+) -->

      <div class="rp-label">Detail</div>

    </aside>

  </div><!-- /body -->

</div><!-- /app -->

// ─── RENDER ENGINE ────────────────────────────────────────────────────────────
function setContent(html){document.getElementById('content').innerHTML=html}
function setRight(html){document.getElementById('rightContent').innerHTML=html}

function openSheet(title, key){
  document.getElementById('sheetTitle').textContent=title;
  document.getElementById('sheetBody').innerHTML=key?SHEET_CONTENT[key]||'':document.getElementById('sheetBody').innerHTML;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('sheet').setAttribute('aria-hidden','false');
}
function showSheet(key){
  const titles={task:'Task Detail',notif:'Notification',l3:'L3 — Evidence',l4:'L4 — Constitutional',memory:'Memory Provenance',conflict:'Knowledge Conflict',long:'Evidence Detail'};
  openSheet(titles[key]||'Detail', key);
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheet').setAttribute('aria-hidden','true');
}

// ─── CONNECTION STATE ─────────────────────────────────────────────────────────
function setConnState(state){
  connState=state;
  const dot=document.getElementById('connDot');
  const banner=document.getElementById('connBanner');
  const btext=document.getElementById('connBannerText');
  const bbtn=document.getElementById('connBannerBtn');
  dot.className='conn-sm';
  banner.className='';
  if(state==='live'){dot.title='Connection: LIVE';dot.setAttribute('aria-label','Connection: live');}
  else if(state==='degraded'){dot.classList.add('warn');banner.classList.add('degraded');btext.textContent='⚠ Degraded — events may be delayed';bbtn.textContent='Status';dot.setAttribute('aria-label','Connection: degraded');}
  else if(state==='disconnected'){dot.classList.add('err');banner.classList.add('disconnected');btext.textContent='✕ Disconnected — no live events';bbtn.textContent='Retry';dot.setAttribute('aria-label','Connection: disconnected');}
  else if(state==='reconnecting'){dot.classList.add('warn','pulse');banner.classList.add('reconnecting');btext.textContent='↻ Reconnecting (attempt 2/5)…';bbtn.textContent='Cancel';dot.setAttribute('aria-label','Connection: reconnecting');}
}
function simulateReconnect(){setConnState('reconnecting');setTimeout(()=>setConnState('live'),3000);}

// ─── VOICE ────────────────────────────────────────────────────────────────────
const VOICE_STEPS=[
  {state:'ACTIVATING',orb:'',icon:'🎙',transcript:'',privacy:false,barge:false},
  {state:'LISTENING',orb:'listening',icon:'🎙',transcript:'Listening…',privacy:false,barge:false},
  {state:'UNDERSTANDING',orb:'',icon:'💬',transcript:'Morning briefing, please',privacy:false,barge:false},
  {state:'THINKING',orb:'thinking',icon:'◎',transcript:'',privacy:true,barge:false},
  {state:'SPEAKING',orb:'speaking',icon:'🔊',transcript:'Good morning. Here is your briefing…',privacy:false,barge:true},
  {state:'COMPLETED',orb:'',icon:'✓',transcript:'Session complete',privacy:false,barge:false},
];
const VOICE_FAILED_STEPS=[
  {state:'ACTIVATING',orb:'',icon:'🎙',transcript:'',privacy:false,barge:false},
  {state:'FAILED',orb:'failed',icon:'✕',transcript:'Microphone permission denied',privacy:false,barge:false},
];

function startVoice(mode){
  const fab=document.getElementById('voiceFab');
  const overlay=document.getElementById('voiceOverlay');
  fab.classList.add(mode==='failed'?'':'listening');
  overlay.classList.add('on');
  overlay.setAttribute('aria-hidden','false');
  fab.setAttribute('aria-pressed','true');
  const steps=mode==='failed'?VOICE_FAILED_STEPS:mode==='thinking'?VOICE_STEPS.slice(0,4):mode==='speaking'?VOICE_STEPS.slice(0,5):VOICE_STEPS;
  let i=0;
  function doStep(){
    if(i>=steps.length) return;
    const s=steps[i++];
    document.getElementById('voiceState').textContent=s.state;
    document.getElementById('voiceOrb').className='orb'+(s.orb?' '+s.orb:'');
    document.getElementById('voiceOrb').textContent=s.icon;
    document.getElementById('voiceTranscript').textContent=s.transcript;
    document.getElementById('voicePrivacy').style.display=s.privacy?'block':'none';
    document.getElementById('voiceWave').style.display=(s.state==='LISTENING'||s.state==='SPEAKING')?'flex':'none';
    const bargeBtn=document.getElementById('bargeInBtn');
    if(bargeBtn) bargeBtn.style.display=s.barge?'inline-flex':'none';
    if(s.state!=='COMPLETED'&&s.state!=='FAILED') voiceTimer=setTimeout(doStep,1800);
  }
  doStep();
}
function toggleVoice(){
  const overlay=document.getElementById('voiceOverlay');
  if(overlay.classList.contains('on')){cancelVoice();}else{startVoice('listening');}
}
function cancelVoice(){
  clearTimeout(voiceTimer);
  const overlay=document.getElementById('voiceOverlay');
  overlay.classList.remove('on');
  overlay.setAttribute('aria-hidden','true');
  const fab=document.getElementById('voiceFab');
  fab.className='';
  fab.id='voiceFab';
  fab.setAttribute('aria-pressed','false');
  document.getElementById('voiceState').textContent='IDLE';
  document.getElementById('voiceWave').style.display='none';
  document.getElementById('voicePrivacy').style.display='none';
}
function bargeIn(){
  document.getElementById('voiceState').textContent='INTERRUPTED';
  document.getElementById('voiceTranscript').textContent='Session interrupted by user';
  setTimeout(cancelVoice,1000);
}

// ─── NAV ─────────────────────────────────────────────────────────────────────
function toggleNav(){
  const nav=document.getElementById('sideNav');
  const overlay=document.getElementById('navOverlay');
  const btn=document.getElementById('menuBtn');
  const open=nav.classList.toggle('open');
  overlay.classList.toggle('on',open);
  nav.setAttribute('aria-hidden',!open);
  btn.setAttribute('aria-expanded',open);
}
function closeNav(){
  document.getElementById('sideNav').classList.remove('open');
  document.getElementById('navOverlay').classList.remove('on');
  document.getElementById('sideNav').setAttribute('aria-hidden','true');
  document.getElementById('menuBtn').setAttribute('aria-expanded','false');
}
function setNavActive(el){document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));el.classList.add('active');}
function setBnavActive(el){document.querySelectorAll('.bn-item').forEach(n=>n.classList.remove('active'));el.classList.add('active');}
function toggleDom(el){document.querySelectorAll('.dom-pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');}

// ─── VIEWPORT SIMULATOR ───────────────────────────────────────────────────────
function setVP(vp){
  currentVP=vp;
  const wrap=document.getElementById('outerWrap');
  wrap.className=['vp-mobile','vp-tablet','vp-desktop'].map(c=>c).join(' ');
  wrap.className='vp-'+vp;
  ['m','t','d'].forEach((id,i)=>{
    const btn=document.getElementById('vp-'+id);
    const v=['mobile','tablet','desktop'][i];
    btn.classList.toggle('active',v===vp);
    btn.setAttribute('aria-pressed',v===vp);
  });
  const sizes={mobile:'390 × mobile portrait',tablet:'834 × tablet',desktop:'1440 × desktop'};
  document.getElementById('simInfo').textContent=sizes[vp];
  closeSheet();
  closeNav();
}

function confirmAppr(){document.getElementById('apprConfirm').innerHTML='<div class="success-box"><p>✓ Approved — action will execute after constitutional gate check.</p></div>';}
function declineAppr(){document.getElementById('apprConfirm').style.display='none';document.querySelector('.appr-area').innerHTML='<div class="success-box"><p>Action declined. NOT EXECUTED.</p></div>';}

// ─── LOAD SCENARIO ────────────────────────────────────────────────────────────
function loadScenario(id){
  currentScenario=id;
  cancelVoice();closeSheet();closeNav();
  setConnState('live');
  const s=SCENARIOS[id];
  if(!s) return;
  document.getElementById('scenarioSelect').value=id;
  if(s.conn&&s.conn!=='live') setConnState(s.conn);
  s.render();
  document.querySelectorAll('.scenario-btn').forEach(b=>{b.classList.toggle('active',b.dataset.id===id);});
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
const sel=document.getElementById('scenarioSelect');
Object.entries(SCENARIOS).forEach(([id,s],i)=>{
  const opt=document.createElement('option');
  opt.value=id;opt.textContent=`${String(i+1).padStart(2,'0')}. ${s.name}`;
  sel.appendChild(opt);
});
loadScenario('V-MOBILE-01');
</script>
